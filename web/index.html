<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Генератор словоформ</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">ПРОТОТИП · РУССКИЙ ЯЗЫК</p><h1>Генератор словоформ</h1><p>Введите словарное описание в JSON, чтобы получить формы с ударениями.</p></header>
    <section aria-labelledby="input-title">
      <div class="section-head"><h2 id="input-title">Описание слова</h2><button id="example" class="secondary" type="button">Пример</button></div>
      <label for="input">Один объект или массив объектов</label>
      <textarea id="input" spellcheck="false">{ "lemma": "столбе́ц", "symbol": "м", "grammar": "5*b" }</textarea>
      <div class="actions"><button id="generate" type="button" disabled>Построить словоформы</button><span id="status" role="status" aria-live="polite">Загружается Python…</span></div>
    </section>
    <section aria-labelledby="result-title"><div class="section-head"><h2 id="result-title">Результат</h2><button id="copy" class="secondary" type="button" disabled>Копировать JSON</button></div><div id="summary" aria-live="polite" class="summary">Здесь появятся словоформы и диагностика.</div><div id="results"></div><details><summary>Полный результат JSON</summary><pre id="output"></pre></details></section>
    <footer>Обработка выполняется в браузере. <a href="https://github.com/ilsuh/check_codex/blob/main/docs/special.md">Ограничения программы</a></footer>
  </main>
</body>
</html>
